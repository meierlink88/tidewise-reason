id: https://tidewise.ai/semantic-model/event
name: tidewise_event_semantic_model
title: Tidewise Event Semantic Model
description: >-
  The first Tidewise concept definition used to verify LinkML compilation, Semantica ontology
  loading, semantic validation, and task-scoped Agent context assembly.
license: https://opensource.org/license/mit
version: 0.1.0

prefixes:
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  tidewise: https://tidewise.ai/ontology/
  xsd: http://www.w3.org/2001/XMLSchema#

default_prefix: tidewise
default_range: string
imports:
  - linkml:types

classes:
  Event:
    class_uri: tidewise:Event
    title: Event
    description: >-
      An atomic, source-supported occurrence that happened or is stated to happen at a specific
      or explicitly unknown time. An Event records facts rather than downstream investment impact.
    annotations:
      semantic_kind: ObjectType
      inclusion_criteria: A concrete occurrence supported by at least one evidence source.
      exclusion_criteria: Opinion, theme, prediction without an occurrence, or inferred impact.
    slots:
      - event_id
      - title
      - factual_summary
      - occurred_at

slots:
  event_id:
    slot_uri: schema:identifier
    title: Event ID
    description: Stable identity assigned by the owning domain service.
    identifier: true
    required: true
    range: string

  title:
    slot_uri: schema:headline
    title: Title
    description: A concise factual title for the occurrence.
    required: true
    range: string
    pattern: ".*\\S.*"

  factual_summary:
    slot_uri: schema:description
    title: Factual summary
    description: Source-supported factual description without downstream investment inference.
    required: true
    range: string

  occurred_at:
    slot_uri: schema:startDate
    title: Occurred at
    description: Time the occurrence happened; omitted when the source does not establish it.
    required: false
    range: datetime
