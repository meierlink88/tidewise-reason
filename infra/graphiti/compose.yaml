name: tidewise-reasoning

services:
  neo4j:
    image: neo4j:5.26.28-community@sha256:ff32db30b2baff97971e441b46bfd9c832c1b62c970398ef579244c06b21d357
    container_name: reason-graphiti-neo4j
    restart: unless-stopped
    ports:
      - '127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474'
      - '127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687'
    environment:
      NEO4J_AUTH: '${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - graphiti-neo4j-data:/data
      - graphiti-neo4j-logs:/logs
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:7474']
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [tidewise-local]

  api:
    build:
      context: ../..
      dockerfile: infra/ingestion/Dockerfile
    image: tidewise-reason-ingestion:graphiti-0.29.3
    container_name: reason-graphiti-api
    restart: unless-stopped
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - '127.0.0.1:8890:8890'
    environment:
      NEO4J_USER: '${NEO4J_USER:?NEO4J_USER is required}'
      NEO4J_PASSWORD: '${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}'
      NEO4J_HTTP_PORT: '7474'
      NEO4J_BOLT_PORT: '7687'
      NEO4J_URI: 'bolt://neo4j:7687'
      GRAPHITI_LLM_API_KEY: '${GRAPHITI_LLM_API_KEY:?GRAPHITI_LLM_API_KEY is required}'
      GRAPHITI_LLM_BASE_URL: '${GRAPHITI_LLM_BASE_URL:?GRAPHITI_LLM_BASE_URL is required}'
      GRAPHITI_LLM_MODEL: '${GRAPHITI_LLM_MODEL:?GRAPHITI_LLM_MODEL is required}'
      GRAPHITI_EMBEDDING_API_KEY: '${GRAPHITI_EMBEDDING_API_KEY:?GRAPHITI_EMBEDDING_API_KEY is required}'
      GRAPHITI_EMBEDDING_BASE_URL: '${GRAPHITI_EMBEDDING_BASE_URL:?GRAPHITI_EMBEDDING_BASE_URL is required}'
      GRAPHITI_EMBEDDING_MODEL: '${GRAPHITI_EMBEDDING_MODEL:?GRAPHITI_EMBEDDING_MODEL is required}'
      GRAPHITI_EMBEDDING_DIM: '${GRAPHITI_EMBEDDING_DIM:?GRAPHITI_EMBEDDING_DIM is required}'
      REASON_API_SERVICE_TOKEN: '${REASON_API_SERVICE_TOKEN:-}'
      REASON_STATE_PATH: '/var/lib/tidewise-reason/state.sqlite3'
      REASON_WORKER_POLL_INTERVAL_SECONDS: '${REASON_WORKER_POLL_INTERVAL_SECONDS:-1}'
      REASON_WORKER_BATCH_SIZE: '${REASON_WORKER_BATCH_SIZE:-5}'
      TIDEWISE_DATA_BASE_URL: '${TIDEWISE_DATA_BASE_URL:?TIDEWISE_DATA_BASE_URL is required}'
      TIDEWISE_DATA_SERVICE_TOKEN: '${TIDEWISE_DATA_SERVICE_TOKEN:?TIDEWISE_DATA_SERVICE_TOKEN is required}'
    volumes:
      - graphiti-api-state:/var/lib/tidewise-reason
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8890/readyz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks: [tidewise-local]

networks:
  tidewise-local:
    external: true
    name: tidewise-local

volumes:
  graphiti-neo4j-data:
    name: tidewise-reason_graphiti-neo4j-data
  graphiti-neo4j-logs:
    name: tidewise-reason_graphiti-neo4j-logs
  graphiti-api-state:
    name: tidewise-reason_graphiti-api-state
