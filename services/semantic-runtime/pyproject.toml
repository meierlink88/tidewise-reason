[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tidewise-semantic-runtime"
version = "0.1.0"
description = "Semantic infrastructure for Tidewise Agent OS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "linkml==1.11.1",
  "llvmlite==0.44.0",
  "numba==0.61.2",
  "numpy==1.26.4",
  "onnxruntime==1.20.1",
  "semantica[explorer,shacl]==0.6.0",
  "torch==2.2.2",
  "transformers==4.57.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tidewise_semantic_runtime"]
