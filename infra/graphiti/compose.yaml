name: tidewise-reasoning

services:
  neo4j:
    image: neo4j:5.26.28-community@sha256:ff32db30b2baff97971e441b46bfd9c832c1b62c970398ef579244c06b21d357
    container_name: reason-graphiti-neo4j
    restart: unless-stopped
    ports:
      - '127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474'
      - '127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687'
    environment:
      NEO4J_AUTH: '${NEO4J_USER:?NEO4J_USER is required}/${NEO4J_PASSWORD:?NEO4J_PASSWORD is required}'
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 2G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - graphiti-neo4j-data:/data
      - graphiti-neo4j-logs:/logs
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:7474']
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [tidewise-local]

networks:
  tidewise-local:
    external: true
    name: tidewise-local

volumes:
  graphiti-neo4j-data:
    name: tidewise-reason_graphiti-neo4j-data
  graphiti-neo4j-logs:
    name: tidewise-reason_graphiti-neo4j-logs
