name: tidewise-reason-uat

services:
  server:
    container_name: reason-server-uat
    image: ${OPENSPG_SERVER_IMAGE:?OPENSPG_SERVER_IMAGE is required}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENSPG_WEB_PORT:-8887}:8887"
    environment:
      TZ: Asia/Shanghai
      LANG: C.UTF-8
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "release-openspg-neo4j:host-gateway"
    command:
      - java
      - -Dfile.encoding=UTF-8
      - -Xms2048m
      - -Xmx8192m
      - -jar
      - arks-sofaboot-0.0.1-SNAPSHOT-executable.jar
      - --server.repository.impl.jdbc.host=mysql
      - --server.repository.impl.jdbc.password=${OPENSPG_MYSQL_ROOT_PASSWORD:?OPENSPG_MYSQL_ROOT_PASSWORD is required}
      - --jasypt.encryptor.password=${OPENSPG_JASYPT_PASSWORD:?OPENSPG_JASYPT_PASSWORD is required}
      - --builder.model.execute.num=20
      - --cloudext.graphstore.url=neo4j://release-openspg-neo4j:7687?user=${OPENSPG_NEO4J_USER:?OPENSPG_NEO4J_USER is required}&password=${OPENSPG_NEO4J_PASSWORD:?OPENSPG_NEO4J_PASSWORD is required}&database=neo4j
      - --cloudext.searchengine.url=neo4j://release-openspg-neo4j:7687?user=${OPENSPG_NEO4J_USER:?OPENSPG_NEO4J_USER is required}&password=${OPENSPG_NEO4J_PASSWORD:?OPENSPG_NEO4J_PASSWORD is required}&database=neo4j
      - --cloudext.objectstorage.url=minio://minio:9000?accessKey=${OPENSPG_MINIO_ACCESS_KEY:?OPENSPG_MINIO_ACCESS_KEY is required}&secretKey=${OPENSPG_MINIO_SECRET_KEY:?OPENSPG_MINIO_SECRET_KEY is required}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8887/actuator/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    networks: [tidewise-uat]

networks:
  tidewise-uat:
    external: true
    name: tidewise-uat
