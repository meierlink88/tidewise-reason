name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  uat-contract:
    name: Validate Reason UAT contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Compose and ownership boundaries
        run: bash scripts/verify-uat-contract.sh

      - name: Lint deployment scripts
        run: shellcheck scripts/*.sh infra/uat/*.sh
