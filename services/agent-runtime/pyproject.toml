[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tidewise-agent-runtime"
version = "0.1.0"
description = "Agent execution infrastructure for Tidewise Agent OS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "agno[async-postgres,os]==2.8.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tidewise_agent_runtime"]
