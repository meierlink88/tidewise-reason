[project]
name = "tidewise-agent-os"
version = "0.1.0"
description = "Tidewise Agent OS monorepo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "tidewise-agent-runtime",
  "tidewise-semantic-runtime",
]

[dependency-groups]
dev = [
  "pytest==8.4.2",
  "ruff==0.12.12",
]

[tool.pytest.ini_options]
testpaths = [
  "services/agent-runtime/tests",
  "services/semantic-runtime/tests",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.uv]
package = false
# Semantica 0.6.0 requires NumPy >=2, while the last PyTorch wheel available for Intel macOS uses
# the NumPy 1 ABI. Remove this override after a compatible Semantica/PyTorch pair is verified on
# Intel macOS, or when Intel macOS is no longer supported.
override-dependencies = ["numpy==1.26.4"]

[tool.uv.workspace]
members = [
  "services/agent-runtime",
  "services/semantic-runtime",
]

[tool.uv.sources]
tidewise-agent-runtime = { workspace = true }
tidewise-semantic-runtime = { workspace = true }
# The default PyPI Linux wheel pulls CUDA libraries into every local deployment. Keep the base
# runtime CPU-only; remove this source override only when a separately tested GPU image/profile
# exists or Semantica no longer requires PyTorch in its base dependency set.
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
