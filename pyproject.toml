[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tidewise-semantica-runtime"
version = "0.1.0"
description = "Tidewise proof of concept for an ontology-driven Semantica runtime"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "linkml==1.11.1",
  "llvmlite==0.44.0",
  "numba==0.61.2",
  "onnxruntime==1.20.1",
  "semantica[shacl]==0.6.0",
  "torch==2.2.2",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semantica_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
