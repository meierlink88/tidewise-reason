name: tidewise-agent-os

services:
  neo4j:
    image: neo4j:5.26.28-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Run ./agent-os up to initialize local credentials}
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-7433}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-7434}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c ': >/dev/tcp/127.0.0.1/6333'",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  semantic-runtime:
    image: tidewise-agent-os/semantic-runtime:0.1.0
    build:
      context: ..
      dockerfile: services/semantic-runtime/Dockerfile
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      NEO4J_DATABASE: neo4j
      QDRANT_URL: http://qdrant:6333
    ports:
      - "127.0.0.1:${SEMANTIC_RUNTIME_PORT:-8100}:8100"
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  semantica-explorer:
    image: tidewise-agent-os/semantic-runtime:0.1.0
    command: ["semantic-explorer"]
    environment:
      SEMANTICA_EXPLORER_GRAPH: /data/context-graph.json
      SEMANTICA_EXPLORER_PORT: "8000"
    ports:
      - "127.0.0.1:${SEMANTICA_EXPLORER_PORT:-8000}:8000"
    volumes:
      - explorer_state:/data
    depends_on:
      semantic-runtime:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  agent-runtime:
    image: tidewise-agent-os/agent-runtime:0.1.0
    build:
      context: ..
      dockerfile: services/agent-runtime/Dockerfile
    environment:
      AGENT_RUNTIME_DB_PATH: /data/agent-runtime.db
      SEMANTIC_RUNTIME_URL: http://semantic-runtime:8100
    ports:
      - "127.0.0.1:${AGENT_RUNTIME_PORT:-8200}:8200"
    volumes:
      - agent_runtime_state:/data
    depends_on:
      semantic-runtime:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    restart: unless-stopped

volumes:
  agent_runtime_state:
  explorer_state:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
